const people=[{name:"NAME",position:"Position",mobile:"0962-992-8453 / 0938-320-6040"}];
const MM_TO_PX_500=500/25.4;


function updatePositionUnderline(el){
  if(!el || !el.classList.contains("position")) return;
  const cs=getComputedStyle(el);
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const txt=(el.innerText||"").replace(/\n/g," ");
  const w=Math.ceil(ctx.measureText(txt).width);
  el.style.setProperty("--uline-w",w+"px");
}

function fit(el,max,min){
  el.style.fontSize=max+"px";
  let n=max;
  while(n>min && el.scrollWidth>el.clientWidth){n-=.5;el.style.fontSize=n+"px"}
}
function editable(cls,val,i,key){
  const d=document.createElement("div");
  d.className="edit "+cls;
  d.contentEditable=true;
  d.spellcheck=false;
  d.innerText=val;
  d.onkeydown=(e)=>{if((key==="name"||key==="position") && e.key==="Enter"){e.preventDefault();}};
  d.onpaste=(e)=>{
    if(key==="position"){
      e.preventDefault();
      const t=(e.clipboardData||window.clipboardData).getData("text").replace(/\s*\n\s*/g," ");
      document.execCommand("insertText",false,t);
    }
  };
  d.oninput=()=>{
    let v=d.innerText.replace(/\n/g," ");
    if(key==="name") v=v.toUpperCase();
    people[i][key]=v;
    if(key==="position")updatePositionUnderline(d);
    if(key!=="name" && key!=="position")fit(d,13,7);
  };
  requestAnimationFrame(()=>{if(key!=="name" && key!=="position")fit(d,13,7);if(key==="position")updatePositionUnderline(d)});
  return d;
}

function editableMobile(val,i){
  const d=document.createElement("span");
  d.className="mobileNumber";
  d.contentEditable=true;
  d.spellcheck=false;
  d.innerText=val;
  d.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); } };
  d.onpaste=(e)=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text").replace(/\s*\n\s*/g," ");
    document.execCommand("insertText",false,t);
  };
  d.oninput=()=>{
    const v=d.innerText.replace(/\n/g," ");
    people[i].mobile=v;
  };
  return d;
}

function makeCard(p,i){
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<img class="master" src="${MASTER}">
    <div class="nameCover"></div><div class="positionCleanCover"></div>
    <div class="addressBlock">
      <div>R.A.Y.D. Commercial Building</div>
      <div>Lot 9 Blk 12 NHA Phase 2</div>
      <div>Circumferential Rd., Pahanocoy,</div>
      <div>Bacolod City, Negros Occidental</div>
      <div class="mobileLine"><span class="mobileLabel">Mobile:</span><span class="mobileMount"></span></div>
    </div>`;
  c.append(editable("name",p.name,i,"name"),editable("position",p.position,i,"position"));
  c.querySelector(".mobileMount").replaceWith(editableMobile(p.mobile||"",i));
  return c;
}
function render(){
  const w=document.getElementById("work"); w.innerHTML="";
  people.forEach((p,i)=>{
    const box=document.createElement("div"); box.className="item";
    const t=document.createElement("div"); t.className="itemtitle"; t.textContent="Calling Card "+(i+1);
    box.append(t,makeCard(p,i)); w.append(box);
  });
}
function addCard(){
  if(people.length>=10){alert("Maximum of 10 calling cards.");return}
  people.push({name:"NAME",position:"Position",mobile:"0962-992-8453 / 0938-320-6040"}); render();
}
async function cardCanvas(card){
  const W=Math.round(89*MM_TO_PX_500), H=Math.round(51*MM_TO_PX_500);
  const cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");

  // Draw the original calling-card artwork directly.
  const bg=new Image();
  await new Promise((resolve,reject)=>{
    bg.onload=resolve;
    bg.onerror=reject;
    bg.src=MASTER;
  });
  ctx.drawImage(bg,0,0,W,H);

  // Cover the original NAME / Position placeholders exactly as the app preview does.
  ctx.fillStyle="#fff";
  ctx.fillRect(W*.345,H*.400,W*.31,H*.145);
  ctx.fillRect(W*.395,H*.535,W*.21,H*.09);

  const idx=[...document.querySelectorAll(".card")].indexOf(card);
  const p=people[Math.max(0,idx)] || {name:"NAME",position:"Position",mobile:"0962-992-8453 / 0938-320-6040"};


  // Restored address block + editable mobile number.
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#000";
  const addrFontPx=Math.round(7.35*(500/96));
  ctx.font=addrFontPx+'px "Berlin Sans FB","Trebuchet MS","Arial Rounded MT",Arial,sans-serif';
  const addrX=W*(.7775 + 2/89);
  const addrLineH=Math.round(8.26*(500/96));
  const addrStartY=H*.178;
  const addrLines=[
    "R.A.Y.D. Commercial Building",
    "Lot 9 Blk 12 NHA Phase 2",
    "Circumferential Rd., Pahanocoy,",
    "Bacolod City, Negros Occidental"
  ];
  addrLines.forEach((line,n)=>ctx.fillText(line,addrX,addrStartY+n*addrLineH));

  const mobileLabel="Mobile:";
  const mobileNumber=p.mobile||"";
  const gap=Math.round(2*(500/96));
  const labelW=ctx.measureText(mobileLabel).width;
  const numW=ctx.measureText(mobileNumber).width;
  const totalW=labelW+gap+numW;
  const mobileY=addrStartY+4*addrLineH;
  ctx.textAlign="left";
  const mobileStartX=addrX-totalW/2;
  ctx.fillText(mobileLabel,mobileStartX,mobileY);
  ctx.fillText(mobileNumber,mobileStartX+labelW+gap,mobileY);
  ctx.restore();

  // NAME — fixed size, Arial Rounded Bold style, moved down exactly 1 mm.
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#000";
  ctx.font='bold '+Math.round(23*(500/96))+'px "Arial Rounded MT Bold","Arial Rounded MT",Arial,sans-serif';
  ctx.shadowColor="rgba(120,120,120,.55)";
  ctx.shadowOffsetX=Math.max(1,Math.round(500/96));
  ctx.shadowOffsetY=Math.max(1,Math.round(500/96));
  ctx.shadowBlur=Math.max(1,Math.round(500/96));
  const nameY=H*(.42960784+.06);
  ctx.fillText((p.name||"").toUpperCase(),W*.5,nameY);
  ctx.restore();

  // Editable Position
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#08a9e8";
  ctx.font='italic '+Math.round(13*(500/96))+'px Arial,sans-serif';
  const posText=p.position||"";
  const posY=H*(.55480392+.035);
  ctx.fillText(posText,W*.5,posY);
  const metrics=ctx.measureText(posText);
  const underlineY=posY+Math.round(8*(500/96));
  ctx.beginPath();
  ctx.moveTo(W*.5-metrics.width/2,underlineY);
  ctx.lineTo(W*.5+metrics.width/2,underlineY);
  ctx.lineWidth=Math.max(2,Math.round(.5*(500/96)));
  ctx.strokeStyle="#08a9e8";
  ctx.stroke();
  ctx.restore();

  return cv;
}
async function downloadCards(){
  try{
    const card=document.querySelector(".card");
    if(!card){alert("No calling card found.");return;}

    // Render the single editable calling card at exact 89 x 51 mm, 500 DPI.
    const one=await cardCanvas(card);

    // A4 portrait at 500 DPI: 210 x 297 mm.
    const A4W=Math.round(210*MM_TO_PX_500);
    const A4H=Math.round(297*MM_TO_PX_500);
    const CW=Math.round(89*MM_TO_PX_500);
    const CH=Math.round(51*MM_TO_PX_500);

    const sheet=document.createElement("canvas");
    sheet.width=A4W;
    sheet.height=A4H;
    const ctx=sheet.getContext("2d");
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,A4W,A4H);

    // 2 columns x 5 rows = 10 cards.
    // Keep every card exactly 89 x 51 mm.
    const cols=2, rows=5;
    const gapX=(A4W-(cols*CW))/(cols+1);
    const gapY=(A4H-(rows*CH))/(rows+1);

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const x=Math.round(gapX+(c*(CW+gapX)));
        const y=Math.round(gapY+(r*(CH+gapY)));
        ctx.drawImage(one,x,y,CW,CH);
      }
    }

    const a=document.createElement("a");
    a.download="LEVEL88_A4_10_Calling_Cards_500DPI.png";
    a.href=sheet.toDataURL("image/png");
    a.click();
  }catch(err){
    console.error(err);
    alert("Unable to download the A4 calling-card sheet.");
  }
}
render();
